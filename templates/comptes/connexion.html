{% extends "base.html" %}
{% load static %}
{% block titre %}Connexion{% endblock %}
{% block contenu %}
<div class="page-connexion d-flex align-items-center justify-content-center">
  <div class="card shadow-sm carte-connexion w-100">
    <div class="card-body p-4">
      <div class="text-center mb-4">
        <img src="{% static 'img/logo_ensiasd.jpg' %}" alt="École Nationale Supérieure de l'Intelligence Artificielle et Sciences des Données – Taroudant" class="logo-connexion mb-3">
        <h1 class="h4 mb-0">Espace Numérique de Travail</h1>
      </div>

      {% for erreur in form.non_field_errors %}
        <div class="alert alert-danger small">{{ erreur }}</div>
      {% endfor %}

      <form method="post">
        {% csrf_token %}
        <input type="hidden" name="next" value="{{ next }}">
        <div class="mb-3">
          <label for="id_username" class="form-label">Identifiant</label>
          <input type="text" name="username" id="id_username" class="form-control" autocomplete="username" value="{{ form.username.value|default:'' }}" required autofocus>
        </div>
        <div class="mb-4">
          <label for="id_password" class="form-label">Mot de passe</label>
          <input type="password" name="password" id="id_password" class="form-control" autocomplete="current-password" required>
        </div>
        <button type="submit" class="btn btn-ent w-100">Se connecter</button>
      </form>
      <p class="text-center small mt-3 mb-0"><a href="{% url 'mot_de_passe_oublie' %}">Mot de passe oublié ?</a></p>
    </div>
  </div>
</div>
{% endblock %}
